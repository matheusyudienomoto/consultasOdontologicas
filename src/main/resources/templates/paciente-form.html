<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Paciente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/consultas">🦷 OdontoSys</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/agenda}">Agenda</a>
      <a class="nav-link" th:href="@{/pacientes}">Pacientes</a>
      <a class="nav-link" th:href="@{/dentistas}">Dentistas</a>
      <a class="nav-link" th:href="@{/consultas}">Consultas</a>
      <a class="nav-link" th:href="@{/logout}">Sair</a>
    </div>
  </div>
</nav>
<div class="container mt-5">

  <!-- O título muda dinamicamente dependendo se é cadastro ou edição -->
  <h2 th:text="${paciente.id == null ? 'Novo Paciente' : 'Editar Paciente'}"></h2>

  <div class="card shadow-sm border-0 mt-4">
    <div class="card-body p-4">

      <!-- O th:action aponta para a rota de salvar no Controller -->
      <form th:action="@{/pacientes/salvar}" th:object="${paciente}" method="post">

        <!-- O ID fica oculto, só serve para o Spring saber se é para atualizar ou criar um novo -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
          <label for="nome" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" th:field="*{cpf}" required maxlength="14" placeholder="000.000.000-00">
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="text" class="form-control" id="telefone" th:field="*{telefone}" maxlength="20" placeholder="(00) 00000-0000">
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-success">Salvar</button>
          <a th:href="@{/pacientes}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>

    </div>
  </div>
</div>
</body>
</html>
