<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Dentista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/consultas">🦷 OdontoSys</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/pacientes}">Pacientes</a>
            <a class="nav-link" th:href="@{/dentistas}">Dentistas</a>
            <a class="nav-link" th:href="@{/consultas}">Consultas</a>
        </div>
    </div>
</nav>
<div class="container mt-5">

    <h2 th:text="${dentista.id == null ? 'Novo Dentista' : 'Editar Dentista'}"></h2>

    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-4">

            <form th:action="@{/dentistas/salvar}" th:object="${dentista}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
                </div>

                <div class="mb-3">
                    <label for="cro" class="form-label">CRO</label>
                    <input type="text" class="form-control" id="cro" th:field="*{cro}" required placeholder="Ex: 12345-PR">
                </div>

                <div class="mb-3">
                    <label for="especialidade" class="form-label">Especialidade</label>
                    <input type="text" class="form-control" id="especialidade" th:field="*{especialidade}" required placeholder="Ex: Ortodontia">
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <a th:href="@{/dentistas}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
