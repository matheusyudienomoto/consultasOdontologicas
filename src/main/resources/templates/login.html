<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - OdontoSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">🦷 OdontoSys</span>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <h2 class="text-center">Acesso ao Sistema</h2>

            <div th:if="${mensagemSucesso}" class="alert alert-success mt-4" th:text="${mensagemSucesso}"></div>
            <div th:if="${mensagemErro}" class="alert alert-danger mt-4" th:text="${mensagemErro}"></div>

            <div class="card shadow-sm border-0 mt-4">
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="login" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="login" name="login" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3">
                Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>

        </div>
    </div>
</div>
</body>
</html>
