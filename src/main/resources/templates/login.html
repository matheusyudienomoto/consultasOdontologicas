<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<main class="acesso">
    <th:block th:replace="~{fragments/layout :: acessoIlustracao}"></th:block>

    <div class="acesso-caixa">
        <a th:replace="~{fragments/layout :: marca('Gestão inteligente para sua clínica')}"></a>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <form th:action="@{/login}" method="post" class="acesso-cartao">
            <div>
                <h1>Bem-vindo de volta!</h1>
                <p class="sub">Acesse sua conta para continuar.</p>
            </div>

            <div>
                <label for="login" class="form-label">Usuário</label>
                <div class="campo-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
                    <input type="text" class="form-control" id="login" name="login" placeholder="Seu usuário" required autofocus>
                </div>
            </div>

            <div>
                <label for="senha" class="form-label">Senha</label>
                <div class="campo-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 15v2"/></svg>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Sua senha" required>
                    <button type="button" class="ver-senha" data-senha="senha" aria-label="Mostrar senha">
                        <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9.5 6-.5.8-1.6 2.2-3.1 3.5M6.6 6.6C4.6 8 3.2 10 2.5 12c1 1.5 4.5 6 9.5 6 1.6 0 3-.4 4.3-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 12C3.5 10.5 7 6 12 6s8.5 4.5 9.5 6c-1 1.5-4.5 6-9.5 6s-8.5-4.5-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="acesso-opcoes">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="lembrar" name="lembrar">
                    <label class="form-check-label" for="lembrar">Lembrar de mim</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Entrar
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </form>

        <p class="acesso-rodape">Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
        <p class="acesso-rodape acesso-creditos">© 2026 OdontoSys · Gestão de Consultórios Odontológicos</p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/layout :: verSenha}"></script>
</body>
</html>
