<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<main class="acesso">
    <div class="acesso-caixa">
        <a th:replace="~{fragments/layout :: marca}"></a>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <form th:action="@{/login}" method="post" class="acesso-cartao">
            <div>
                <h1>Entrar</h1>
                <p class="sub">Use seu usuário e senha da clínica.</p>
            </div>

            <div>
                <label for="login" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="login" name="login" required autofocus>
            </div>

            <div>
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <p class="acesso-rodape">Não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
