<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('pacientes')}"></aside>

    <main class="main">
        <div class="cabecalho">
            <div>
                <h1>Pacientes</h1>
                <p>Cadastro de pacientes da clínica</p>
            </div>
            <div class="acoes">
                <a th:href="@{/pacientes/novo}" class="btn btn-primary">+ Novo paciente</a>
            </div>
        </div>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <div class="painel">
            <div class="painel-barra">
                <form th:action="@{/pacientes}" method="get" class="d-flex gap-2">
                    <label for="busca" class="visually-hidden">Buscar por nome</label>
                    <input class="form-control" type="search" id="busca" name="busca" placeholder="Buscar por nome" th:value="${param.busca}">
                    <button class="btn btn-light" type="submit">Pesquisar</button>
                </form>
                <span class="contagem" th:text="${#lists.size(pacientes)} + (${#lists.size(pacientes)} == 1 ? ' paciente' : ' pacientes')"></span>
            </div>

            <div class="table-responsive">
                <table class="table tabela align-middle">
                    <thead>
                    <tr>
                        <th><a th:href="@{/pacientes(sort=${nextSort})}">Nome ↕</a></th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="paciente : ${pacientes}">
                        <td class="nome" th:text="${paciente.nome}"></td>
                        <td class="suave" th:text="${paciente.cpf}"></td>
                        <td th:text="${paciente.telefone}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/pacientes/editar/{id}(id=${paciente.id})}" class="btn-link-acao">Editar</a>
                            <a th:href="@{/pacientes/deletar/{id}(id=${paciente.id})}" class="btn-link-acao perigo" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${pacientes.isEmpty()}">
                        <td colspan="4" class="vazio">Nenhum paciente encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
