<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clínica Odontológica - Pacientes</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/consultas">🦷 Clínica Odontológica </a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/pacientes}">Pacientes</a>
            <a class="nav-link" th:href="@{/dentistas}">Dentistas</a>
            <a class="nav-link" th:href="@{/consultas}">Consultas</a>
        </div>
    </div>
</nav>
<div class="container mt-5">

    <h2>Gerenciamento de Pacientes</h2>

    <!-- Alertas de Sucesso ou Erro (Requisito do Professor) -->
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Barra de Pesquisa e Botão Novo -->
    <div class="d-flex justify-content-between mb-3 mt-4">
        <a th:href="@{/pacientes/novo}" class="btn btn-primary"> + Novo Paciente</a>

        <form th:action="@{/pacientes}" method="get" class="d-flex">
            <input class="form-control me-2" type="search" name="busca" placeholder="Buscar por nome..." aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Pesquisar</button>
        </form>
    </div>

    <!-- Tabela Estilizada com Bootstrap -->
    <table class="table table-hover align-middle mt-3 border">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>
                <a th:href="@{/pacientes(sort=${nextSort})}" style="text-decoration: none; color: white;">Nome ↕</a>
            </th>            <th>CPF</th>
            <th>Telefone</th>
            <th class="text-center">Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- Loop do Thymeleaf -->
        <tr th:each="paciente : ${pacientes}">
            <td th:text="${paciente.id}"></td>
            <td th:text="${paciente.nome}"></td>
            <td th:text="${paciente.cpf}"></td>
            <td th:text="${paciente.telefone}"></td>
            <td class="text-center">
                <a th:href="@{/pacientes/editar/{id}(id=${paciente.id})}" class="btn btn-sm btn-warning">Editar</a>
                <!-- Usando um form pequeno para o botão de deletar por segurança -->
                <a th:href="@{/pacientes/deletar/{id}(id=${paciente.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
            </td>
        </tr>
        <!-- Se não houver pacientes cadastrados -->
        <tr th:if="${pacientes.empty}">
            <td colspan="5" class="text-center text-muted">Nenhum paciente cadastrado.</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- JS do Bootstrap (Necessário para os alertas fecharem) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
