<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/agenda">🦷 OdontoSys</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/agenda}">Agenda</a>
            <a class="nav-link" th:href="@{/pacientes}">Pacientes</a>
            <a class="nav-link" th:href="@{/dentistas}">Dentistas</a>
            <a class="nav-link" th:href="@{/consultas}">Consultas</a>
            <a class="nav-link" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Agenda de Consultas</h2>

    <div class="d-flex justify-content-between mb-3 mt-4">
        <a th:href="@{/consultas/novo}" class="btn btn-primary">+ Agendar Consulta</a>

        <div class="d-flex align-items-center">
            <label for="filtroDentista" class="form-label me-2 mb-0">Dentista</label>
            <select id="filtroDentista" class="form-select">
                <option value="">Todos os dentistas</option>
                <option th:each="d : ${dentistas}" th:value="${d.id}" th:text="${d.nome}"></option>
            </select>
        </div>
    </div>

    <div class="card shadow-sm border-0 mt-3">
        <div class="card-body p-4">
            <div id="calendario"></div>
        </div>
    </div>
</div>

<!-- Detalhes da consulta ao clicar no calendário -->
<div class="modal fade" id="modalConsulta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Detalhes da Consulta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Paciente:</strong> <span id="detPaciente"></span></p>
                <p><strong>Dentista:</strong> <span id="detDentista"></span></p>
                <p><strong>Data e Hora:</strong> <span id="detDataHora"></span></p>
                <p class="mb-0"><strong>Status:</strong> <span id="detStatus"></span></p>
            </div>
            <div class="modal-footer">
                <a id="detEditar" href="#" class="btn btn-warning">Editar</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/pt-br.global.min.js"></script>
<script th:inline="javascript">
    const urlEventos = /*[[@{/agenda/eventos}]]*/ '/agenda/eventos';
    const urlEditar = /*[[@{/consultas/editar/}]]*/ '/consultas/editar/';
    const filtro = document.getElementById('filtroDentista');
    const modal = new bootstrap.Modal(document.getElementById('modalConsulta'));

    const calendario = new FullCalendar.Calendar(document.getElementById('calendario'), {
        locale: 'pt-br',
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '07:00:00',
        slotMaxTime: '20:00:00',
        allDaySlot: false,
        height: 'auto',
        // Busca as consultas do período visível, aplicando o filtro de dentista
        events: function (info, sucesso, falha) {
            const params = new URLSearchParams({ start: info.startStr, end: info.endStr });
            if (filtro.value) {
                params.append('dentistaId', filtro.value);
            }
            fetch(urlEventos + '?' + params)
                .then(resposta => resposta.json())
                .then(sucesso)
                .catch(falha);
        },
        eventClick: function (info) {
            const consulta = info.event;
            document.getElementById('detPaciente').textContent = consulta.title;
            document.getElementById('detDentista').textContent = consulta.extendedProps.dentista;
            document.getElementById('detDataHora').textContent = consulta.start.toLocaleString('pt-BR', {
                dateStyle: 'short', timeStyle: 'short'
            });
            document.getElementById('detStatus').textContent = consulta.extendedProps.status;
            document.getElementById('detEditar').href = urlEditar + consulta.id;
            modal.show();
        }
    });

    calendario.render();
    filtro.addEventListener('change', () => calendario.refetchEvents());
</script>
</body>
</html>
