<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<main class="acesso">
    <div class="acesso-caixa">
        <a th:replace="~{fragments/layout :: marca}"></a>

        <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

        <form th:action="@{/cadastro}" method="post" class="acesso-cartao">
            <div>
                <h1>Criar conta</h1>
                <p class="sub">Cadastre um usuário para acessar o sistema.</p>
            </div>

            <div>
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" th:value="${nome}" required autofocus>
            </div>

            <div>
                <label for="login" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="login" name="login" th:value="${login}" maxlength="50" required>
            </div>

            <div>
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" minlength="6" required>
                <div class="form-text">Mínimo de 6 caracteres.</div>
            </div>

            <div>
                <label for="confirmacaoSenha" class="form-label">Confirmar senha</label>
                <input type="password" class="form-control" id="confirmacaoSenha" name="confirmacaoSenha" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary">Criar conta</button>
        </form>

        <p class="acesso-rodape">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
