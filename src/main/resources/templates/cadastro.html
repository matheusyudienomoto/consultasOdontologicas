<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - OdontoSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold">🦷 OdontoSys</span>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <h2 class="text-center">Criar Conta</h2>

            <div th:if="${mensagemErro}" class="alert alert-danger mt-4" th:text="${mensagemErro}"></div>

            <div class="card shadow-sm border-0 mt-4">
                <div class="card-body p-4">
                    <form th:action="@{/cadastro}" method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" th:value="${nome}" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="login" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="login" name="login" th:value="${login}" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" minlength="6" required>
                            <div class="form-text">Mínimo de 6 caracteres.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmacaoSenha" class="form-label">Confirmar senha</label>
                            <input type="password" class="form-control" id="confirmacaoSenha" name="confirmacaoSenha" minlength="6" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Criar Conta</button>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-center mt-3">
                Já tem conta? <a th:href="@{/login}">Entrar</a>
            </p>

        </div>
    </div>
</div>
</body>
</html>
